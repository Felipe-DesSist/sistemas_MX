<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova senha</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="auth-container">
    <div class="auth-box">
      <p class="reset-title">Nova senha</p>
      <form id="reset-form" novalidate>
        <div class="field">
          <label for="new-pass">Nova senha</label>
          <input id="new-pass" type="password" placeholder="Mín. 8 caracteres" autocomplete="new-password" required minlength="8">
        </div>
        <div class="field">
          <label for="confirm-pass">Confirmar senha</label>
          <input id="confirm-pass" type="password" placeholder="Repita a senha" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-primary">Redefinir senha</button>
        <p class="msg" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="assets/js/reset.js"></script>
</body>
</html>
